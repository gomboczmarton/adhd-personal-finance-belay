schema_version = "1.3"

[task]
name = "belay/reconcile-clean-month"
version = "0.1.0"
description = "Import three months of multi-account bank exports, recognize internal refills, categorize, and reconcile the final month to exact ground-truth totals."
authors = [{ name = "belay maintainers" }]
keywords = ["belay", "finance", "reconciliation", "ingestion"]

[metadata]
capability = "end-to-end monthly reconciliation: ingest -> match transfers -> categorize -> exact totals (D4: scripts do all arithmetic)"
persona = "p01-alex-baseline"
month = "2026-06"
threshold = 1.0
threshold_justification = "Deterministic pipeline over synthetic fixtures with known ground truth; any numeric mismatch is a harness defect, so nothing below exact agreement is acceptable."

[environment]
# Local runs: environment/setup.sh builds the workspace (see evals/README.md).
# The Dockerfile reproduces the same environment for containerized Harbor runs
# (build context = repo root).

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120
