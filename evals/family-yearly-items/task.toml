schema_version = "1.3"

[task]
name = "belay/family-yearly-items"
version = "0.1.0"
description = "Reconcile a family month with dual salaries, heavy card volume, weekly refills, and a yearly tax item due that month."
authors = [{ name = "belay maintainers" }]
keywords = ["belay", "finance", "family", "yearly-items"]

[metadata]
capability = "family-volume month with a yearly item due (car weight tax in March): per-category totals exact including the yearly spike (migrated persona: kovacs-family)"
persona = "p05-kovacs-family"
month = "2026-03"
threshold = 1.0
threshold_justification = "Deterministic pipeline over synthetic fixtures with known ground truth; any numeric mismatch is a harness defect, so nothing below exact agreement is acceptable."

[environment]
# Local runs: environment/setup.sh builds the workspace (see evals/README.md).
# The Dockerfile reproduces the same environment for containerized Harbor runs.

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 240
