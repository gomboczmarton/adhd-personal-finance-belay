name: Release

# Creates the GitHub Release for the version in VERSION, with the packaged
# harness zips attached, whenever main changes those inputs (or on manual
# dispatch). Idempotent: if the release for the current VERSION already
# exists, the job exits cleanly.
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - "dist/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/harness.zip#harness.zip (stable asset for install.py --from-release)" \
            "dist/harness-v${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Belay $TAG" \
            --notes-file .github/release-notes.md
