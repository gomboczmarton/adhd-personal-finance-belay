# Release train (D16): tags are releases. Runs the gates PR CI deliberately
# does not — the frozen anchor sub-suite and the fresh-seed regeneration gate
# (structural anti-overfitting: brand-new ground truth per release) — then the
# sanitization scan + packaging, and publishes dist/harness.zip.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Baseline fixtures + FULL suite (anchor included)
        run: |
          uv run harness/scripts/generate_fixtures.py --all evals/personas evals/fixtures
          python3 evals/run_local.py --fixtures
      - name: Fresh-seed regeneration gate
        run: python3 tools/fresh_seed_gate.py --offset ${{ github.run_number }}
      - name: Sanitization scan + package
        run: uv run tools/package_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release with harness.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Belay $GITHUB_REF_NAME" \
            --generate-notes \
            dist/harness.zip "dist/harness-${GITHUB_REF_NAME#v}.zip" || \
          gh release upload "$GITHUB_REF_NAME" \
            dist/harness.zip "dist/harness-${GITHUB_REF_NAME#v}.zip" --clobber
